name: Linux Kernel Build

on:
  push:
    branches: [ main, master, "*-build" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Custom config (defconfig name)'
        required: false
        default: 'x86_64_defconfig'

env:
  LINUX_VERSION: "6.x"

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            defconfig: "x86_64_defconfig"
            cross_compile: ""
            display_name: "x86_64 (64-bit)"
            
          - arch: i386
            defconfig: "i386_defconfig"
            cross_compile: ""
            display_name: "i386 (32-bit)"
            
          - arch: arm64
            defconfig: "defconfig"
            cross_compile: "aarch64-linux-gnu-"
            display_name: "ARM64"
    
    name: Build - ${{ matrix.display_name }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        
        # 基础依赖
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          git
        
        # 架构特定依赖
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "Installed ARM64 cross-compiler"
        elif [ "${{ matrix.arch }}" = "i386" ]; then
          sudo apt-get install -y gcc-multilib
          echo "Installed 32-bit libraries"
        fi
        
        echo "All dependencies installed for ${{ matrix.arch }}"
    
    - name: Set up build environment
      run: |
        echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
        echo "CROSS_COMPILE=${{ matrix.cross_compile }}" >> $GITHUB_ENV
        
        # 显示环境信息
        echo "Building for: ${{ matrix.arch }}"
        echo "Defconfig: ${{ matrix.defconfig }}"
        echo "Cross-compile prefix: ${{ matrix.cross_compile }}"
    
    - name: Clean and prepare
      run: |
        echo "Cleaning build directory..."
        make mrproper
        
        echo "Configuring kernel with ${{ matrix.defconfig }}..."
        make ARCH=${{ matrix.arch }} ${{ matrix.defconfig }}
    
    - name: Build kernel
      run: |
        echo "Building kernel for ${{ matrix.arch }}..."
        echo "Using ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.cross_compile }}"
        
        # 编译内核
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.cross_compile }} -j$(nproc)
        
        # 编译模块
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.cross_compile }} modules -j$(nproc)
        
        echo "Build completed successfully!"
        
        # 显示生成的文件
        if [ -d "arch/${{ matrix.arch }}/boot" ]; then
          echo "Generated files:"
          ls -la arch/${{ matrix.arch }}/boot/
        else
          echo "Boot directory not found at arch/${{ matrix.arch }}/boot/"
          find . -name "*Image*" -o -name "*bzImage*" -o -name "*zImage*" | head -20
        fi
    
    - name: Generate build info
      run: |
        # 获取内核版本信息
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.cross_compile }} kernelversion > kernel_version.txt 2>/dev/null || echo "unknown" > kernel_version.txt
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.cross_compile }} kernelrelease > kernel_release.txt 2>/dev/null || echo "unknown" > kernel_release.txt
        
        cat > build_info.txt << EOF
        ===== Linux Kernel Build Info =====
        Architecture: ${{ matrix.arch }}
        Defconfig: ${{ matrix.defconfig }}
        Build Date: $(date)
        Commit: ${{ github.sha }}
        Workflow: ${{ github.workflow }}
        Run ID: ${{ github.run_id }}
        ===================================
        EOF
    
    - name: Archive kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ matrix.arch }}
        path: |
          arch/${{ matrix.arch }}/boot/
          kernel_version.txt
          kernel_release.txt
          build_info.txt
          .config
        retention-days: 7
    
    - name: Archive modules (if any)
      if: success()
      run: |
        # 检查是否有模块文件生成
        if [ -f "modules.order" ]; then
          echo "Found modules.order file"
          mkdir -p modules_${{ matrix.arch }}
          cp modules.order modules_${{ matrix.arch }}/
          # 你也可以复制实际的模块文件
          # find . -name "*.ko" -exec cp {} modules_${{ matrix.arch }}/ \;
        else
          echo "No modules.order file found"
          touch no_modules_${{ matrix.arch }}.txt
        fi
    
    - name: Clean up (optional)
      if: always()
      run: |
        echo "Cleaning up intermediate files..."
        # 可以清理一些中间文件以节省空间
        # make clean
